<!DOCTYPE html>

<html>

<body>
    <h1>Phone Sensor Demo.</h1>

    <button onclick="startSensors()">Start Sensors</button>

    <h2>Accelerometer</h2>

    <p>X: <span id="x">0</span></p>
    <p>Y: <span id="y">0</span></p>
    <p>Z: <span id="z">0</span></p>

    <script>

        async function startSensors() {

            // Required for iPhone/iPad

            if (typeof DeviceMotionEvent.requestPermission === "function") {

                const permission =

                    await DeviceMotionEvent.requestPermission();

                if (permission !== "granted") {

                    alert("Permission denied");

                    return;
                }
            }

            window.addEventListener("devicemotion", function (event) {

                document.getElementById("x").textContent =
                    event.accelerationIncludingGravity.x?.toFixed(2);

                document.getElementById("y").textContent =
                    event.accelerationIncludingGravity.y?.toFixed(2);

                document.getElementById("z").textContent =
                    event.accelerationIncludingGravity.z?.toFixed(2);

            });
        }
    </script>
</body>

</html>
